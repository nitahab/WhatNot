<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Year Converter</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .converter {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 380px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input, select {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
    }

    .swap {
      text-align: center;
      cursor: pointer;
      font-size: 20px;
      margin: 5px 0;
      user-select: none;
    }

    .swap:hover {
      color: #2c7be5;
    }

    .result {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #2c7be5;
      margin-top: 10px;
    }

    .caption {
      text-align: center;
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div class="converter">
  <h1>Year Converter</h1>

  <div class="row">
    <input type="number" id="inputValue" placeholder="Enter value" />
    <select id="fromUnit">
      <option value="human">Human years</option>
      <option value="dog">Dog years</option>
      <option value="battery">Laptop Battery years</option>
      <option value="truck">Bryce’s Truck years</option>
    </select>
  </div>

  <div class="swap" id="swapBtn">⇄</div>

  <div class="row">
    <select id="toUnit">
      <option value="dog">Dog years</option>
      <option value="human">Human years</option>
      <option value="battery">Laptop Battery years</option>
      <option value="truck">Bryce’s Truck years</option>
    </select>
  </div>

  <div class="result" id="result">0</div>
  <div class="caption" id="caption"></div>
</div>

<script>
  const input = document.getElementById("inputValue");
  const fromUnit = document.getElementById("fromUnit");
  const toUnit = document.getElementById("toUnit");
  const result = document.getElementById("result");
  const caption = document.getElementById("caption");
  const swapBtn = document.getElementById("swapBtn");

  // Convert TO human years (base unit)
  const toHuman = {
    human: (v) => v,
    dog: (v) => v / 7,
    battery: (v) => v / 20,
    truck: (v) => v * 5
  };

  // Convert FROM human years
  const fromHuman = {
    human: (v) => v,
    dog: (v) => v * 7,
    battery: (v) => v * 20,
    truck: (v) => v / 5
  };

  function convert() {
    const value = parseFloat(input.value);

    if (isNaN(value)) {
      result.textContent = "0";
      caption.textContent = "";
      return;
    }

    const humanYears = toHuman[fromUnit.value](value);
    const finalValue = fromHuman[toUnit.value](humanYears);

    result.textContent = finalValue.toFixed(2);

    caption.textContent =
      `${value} ${label(fromUnit.value)} ≈ ${finalValue.toFixed(2)} ${label(toUnit.value)}`;
  }

  function label(unit) {
    switch(unit) {
      case "human": return "human years";
      case "dog": return "dog years";
      case "battery": return "battery years";
      case "truck": return "Bryce’s Truck years";
    }
  }

  // Swap units
  swapBtn.addEventListener("click", () => {
    const temp = fromUnit.value;
    fromUnit.value = toUnit.value;
    toUnit.value = temp;
    convert();
  });

  input.addEventListener("input", convert);
  fromUnit.addEventListener("change", convert);
  toUnit.addEventListener("change", convert);

</script>

</body>
</html>
