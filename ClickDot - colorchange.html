
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clickable Dot Grid</title>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end; /* align items to the bottom */
    align-items: flex-start; /* align items to the left */
    height: 100vh;
    background-color: white; /* Set background to white */
  }
  #grid {
    position: relative;
    width: 100%; /* Expand to fit full browser width */
    height: 100%; /* Expand to fit full browser height */
    border: 1px solid #000;
    display: grid;
    grid-template-columns: repeat(auto-fill, 30px); /* Maintain 30px spacing */
    grid-template-rows: repeat(auto-fill, 30px); /* Maintain 30px spacing */
    column-gap: 10px;
    row-gap: 10px;
  }
  .dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-color: #CCCCCC; /* Set initial dot color to soft grey */
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="grid"></div>

<script>
  const grid = document.getElementById('grid');

  function isGreyColor(color) {
    const r = parseInt(color.slice(1, 3), 16);
    const g = parseInt(color.slice(3, 5), 16);
    const b = parseInt(color.slice(5, 7), 16);
    return r === g && g === b; // Check if the color is grey (r == g == b)
  }

  function getRandomColorExcludingRedAndGrey() {
    const letters = '0123456789ABCDEF';
    let color;
    do {
      color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
    } while (color.startsWith('#FF') || isGreyColor(color)); // Avoid colors that are red or grey
    return color;
  }

  function createDot(x, y) {
    const dot = document.createElement('div');
    dot.classList.add('dot');
    dot.style.left = `${x}px`;
    dot.style.top = `${y}px`;
    const originalColor = dot.style.backgroundColor;
    
    dot.addEventListener('mouseover', () => {
        if (!dot.dataset.locked) {
            dot.dataset.originalColor = dot.style.backgroundColor;
            const newColor = getRandomColorExcludingRedAndGrey();
            dot.style.backgroundColor = newColor;
        }
    });
    
    dot.addEventListener('mouseout', () => {
        if (!dot.dataset.locked) {
            dot.style.backgroundColor = dot.dataset.originalColor;
        }
    });
    
    dot.addEventListener('click', () => {
        dot.dataset.locked = true;
    });
    
    grid.appendChild(dot);
  }

  function populateGrid() {
    const dotSize = 30; // size of each dot with spacing
    const gridWidth = grid.clientWidth;
    const gridHeight = grid.clientHeight;

    const cols = Math.floor(gridWidth / dotSize);
    const rows = Math.floor(gridHeight / dotSize);

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        createDot(col * dotSize, row * dotSize);
      }
    }
  }

  window.onload = populateGrid;
  window.onresize = () => {
    grid.innerHTML = ''; // clear the grid
    populateGrid();
  }
</script>

</body>
</html>
